<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f2ed" />
    <meta name="description" content="A live personal status page." />
    <title>Now - Personal status</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f2ed;
        color: #1b1c1a;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        padding: clamp(28px, 7vw, 96px) 22px;
        display: grid;
        place-items: center;
        background:
          linear-gradient(rgba(62, 58, 48, .035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(62, 58, 48, .035) 1px, transparent 1px),
          #f4f2ed;
        background-size: 34px 34px;
      }

      main { width: min(100%, 620px); }

      .masthead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0 2px 16px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #1b1c1a;
        font-size: .82rem;
        font-weight: 800;
        letter-spacing: .13em;
      }

      .brand-mark {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #1b1c1a;
      }

      .masthead-note {
        color: #858177;
        font-size: .77rem;
      }

      .card {
        --accent: #c27c25;
        --accent-soft: #f7ead7;
        overflow: hidden;
        border: 1px solid #e0dcd2;
        border-radius: 18px;
        background: rgba(255, 254, 251, .92);
        box-shadow: 0 18px 44px rgba(49, 43, 29, .09), 0 2px 5px rgba(49, 43, 29, .04);
      }

      .card[data-status="gym"] { --accent: #278158; --accent-soft: #e1f0e8; }
      .card[data-status="work"] { --accent: #3269b2; --accent-soft: #e5edf9; }
      .card[data-status="study"] { --accent: #7b50a6; --accent-soft: #eee7f6; }
      .card[data-status="sleep"] { --accent: #5f6876; --accent-soft: #e9ebef; }
      .card[data-status="stale"], .card[data-status="unset"], .card[data-status="error"] { --accent: #c27c25; --accent-soft: #f7ead7; }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #eeeae2;
        padding: 18px 22px;
      }

      .eyebrow {
        margin: 0;
        color: #77736a;
        font-size: .72rem;
        font-weight: 750;
        letter-spacing: .1em;
        text-transform: uppercase;
      }

      .signal {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: #77736a;
        font-size: .78rem;
      }

      .signal-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
      }

      .state {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 18px;
        align-items: start;
        padding: clamp(30px, 7vw, 46px) 22px 28px;
      }

      .status-mark {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        color: var(--accent);
        background: var(--accent-soft);
        font-size: 1.1rem;
        font-weight: 800;
      }

      h1 {
        margin: -3px 0 0;
        color: #20211f;
        font-size: clamp(2.75rem, 8vw, 4.2rem);
        line-height: .94;
        letter-spacing: -.065em;
      }

      .description {
        margin: 12px 0 0;
        color: #69665e;
        font-size: 1rem;
        line-height: 1.5;
      }

      .updated {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 18px;
        margin: 28px 22px 22px;
        padding-top: 16px;
        border-top: 1px solid #eeeae2;
        color: #89857c;
        font-size: .78rem;
      }

      .updated strong { color: var(--accent); font-size: .82rem; font-weight: 750; text-align: right; }

      .note {
        margin: 16px 2px 0;
        color: #89857c;
        font-size: .78rem;
        line-height: 1.5;
      }

      @media (max-width: 440px) {
        .masthead-note { display: none; }
        .card-header { padding: 16px 18px; }
        .state { padding: 30px 18px 24px; }
        .updated { margin: 24px 18px 18px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="masthead">
        <div class="brand"><span class="brand-mark"></span> NOW</div>
        <span class="masthead-note">A small personal status page</span>
      </header>

      <section class="card" id="status-card" data-status="unset" aria-live="polite">
        <div class="card-header">
          <p class="eyebrow" id="eyebrow">Checking status</p>
          <div class="signal"><span class="signal-dot"></span><span id="signal-label">Live</span></div>
        </div>

        <div class="state">
          <div class="status-mark" id="status-mark" aria-hidden="true">N</div>
          <div>
            <h1 id="status">Loading</h1>
            <p class="description" id="description">Getting the latest update.</p>
          </div>
        </div>

        <div class="updated">
          <span>Last updated</span>
          <strong id="meta">Connecting to status service</strong>
        </div>
      </section>

      <p class="note">Set directly from my watch. The page checks for a new update every 30 seconds.</p>
    </main>

    <script>
      const STATUS_URL = "https://personal-status-worker.healthz.workers.dev/status";
      const REFRESH_INTERVAL_MS = 30_000;
      const STALE_AFTER_MS = 15 * 60_000;
      const statusElement = document.querySelector("#status");
      const eyebrowElement = document.querySelector("#eyebrow");
      const descriptionElement = document.querySelector("#description");
      const metaElement = document.querySelector("#meta");
      const signalLabelElement = document.querySelector("#signal-label");
      const markElement = document.querySelector("#status-mark");
      const cardElement = document.querySelector("#status-card");
      const statusInfo = {
        gym: { label: "Gym", mark: "G" },
        work: { label: "Work", mark: "W" },
        study: { label: "Study", mark: "S" },
        sleep: { label: "Sleep", mark: "Z" },
      };

      function setState({ eyebrow, status, description, meta, theme, mark, signalLabel = "Live" }) {
        eyebrowElement.textContent = eyebrow;
        statusElement.textContent = status;
        descriptionElement.textContent = description;
        metaElement.textContent = meta;
        markElement.textContent = mark;
        signalLabelElement.textContent = signalLabel;
        cardElement.dataset.status = theme;
      }

      function timeAgo(timestamp) {
        const minutes = Math.max(0, Math.floor((Date.now() - new Date(timestamp).getTime()) / 60_000));
        if (minutes < 1) return "Just now";
        if (minutes === 1) return "1 minute ago";
        return `${minutes} minutes ago`;
      }

      async function refreshStatus() {
        try {
          const response = await fetch(STATUS_URL, { cache: "no-store" });
          if (response.status === 404) {
            setState({ eyebrow: "Currently", status: "Not set", description: "No status has been shared yet.", meta: "Waiting for the first update", theme: "unset", mark: "?", signalLabel: "Waiting" });
            return;
          }
          if (!response.ok) throw new Error(`Status request failed: ${response.status}`);

          const { status, timestamp } = await response.json();
          const age = Date.now() - new Date(timestamp).getTime();
          const isStale = !Number.isFinite(age) || age > STALE_AFTER_MS;
          const info = statusInfo[status] || { label: "Unknown", mark: "?" };

          setState({
            eyebrow: isStale ? "Last known status" : "Currently",
            status: info.label,
            description: isStale ? "This update may no longer be current." : "Shared directly from my watch.",
            meta: isStale ? `${timeAgo(timestamp)} - may be stale` : timeAgo(timestamp),
            theme: isStale ? "stale" : status,
            mark: info.mark,
            signalLabel: isStale ? "Stale" : "Live",
          });
        } catch {
          setState({ eyebrow: "Status service", status: "Unavailable", description: "The latest status could not be reached.", meta: "Trying again in 30 seconds", theme: "error", mark: "!", signalLabel: "Offline" });
        }
      }

      refreshStatus();
      window.setInterval(refreshStatus, REFRESH_INTERVAL_MS);
    </script>
  </body>
</html>
