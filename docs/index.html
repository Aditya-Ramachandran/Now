<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e8eff2" />
    <meta
      name="description"
      content="A live personal status page powered by a Galaxy Watch."
    />
    <title>Now · Aditya Ramachandran</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --canvas: #e8eff2;
        --ink: #18323b;
        --steel: #7b929b;
        --brass: #d79b3e;
        --fresh: #4e8067;
        --stale: #a86e69;
        --dial-face: #edf3f5;
        --ring-shadow: rgba(24, 50, 59, 0.16);
        --focus: #18323b;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --canvas: #10242b;
        --ink: #e8e4d9;
        --steel: #80979b;
        --brass: #bc8737;
        --fresh: #76a986;
        --stale: #a66b66;
        --dial-face: #112a32;
        --ring-shadow: rgba(0, 0, 0, 0.36);
        --focus: #e8e4d9;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font-family: "Instrument Sans", sans-serif;
      }

      button, a { font: inherit; }

      a, button { -webkit-tap-highlight-color: transparent; }

      a:focus-visible, button:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 4px;
      }

      .page {
        min-height: 100svh;
        width: min(100%, 780px);
        margin: 0 auto;
        padding: clamp(15px, 2.8svh, 28px) clamp(18px, 5vw, 46px) 15px;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      .masthead {
        min-height: 34px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .identity {
        color: var(--ink);
        font-size: 0.92rem;
        font-weight: 560;
        letter-spacing: -0.018em;
        text-decoration: none;
      }

      .identity span { color: var(--steel); font-weight: 450; }

      .theme-toggle {
        border: 1px solid color-mix(in srgb, var(--steel) 45%, transparent);
        color: var(--ink);
        background: transparent;
        border-radius: 999px;
        min-height: 32px;
        padding: 0 11px;
        cursor: pointer;
        font-family: "B612", monospace;
        font-size: 0.72rem;
        transition: background-color 160ms ease, border-color 160ms ease;
      }

      .theme-toggle:hover {
        background: color-mix(in srgb, var(--steel) 12%, transparent);
        border-color: var(--steel);
      }

      main {
        align-self: center;
        display: grid;
        justify-items: center;
        align-content: center;
        gap: clamp(10px, 1.9svh, 17px);
        padding-block: 5px;
      }

      .wordmark {
        margin: 0;
        font-size: clamp(1.15rem, 2.5vw, 1.45rem);
        font-weight: 650;
        letter-spacing: -0.045em;
      }

      .watch-dial {
        --hand-angle: 0deg;
        width: min(72vw, 370px, 44svh);
        aspect-ratio: 1;
        border-radius: 50%;
        position: relative;
        display: grid;
        place-items: center;
        color: var(--ink);
        background:
          repeating-conic-gradient(
            from -1deg,
            transparent 0deg 4deg,
            color-mix(in srgb, var(--steel) 72%, transparent) 4.2deg 4.65deg,
            transparent 4.9deg 6deg
          ),
          var(--dial-face);
        box-shadow:
          inset 0 0 0 1px color-mix(in srgb, var(--steel) 40%, transparent),
          0 14px 28px var(--ring-shadow);
      }

      .watch-dial::before,
      .watch-dial::after {
        content: "";
        position: absolute;
        inset: 5.8%;
        border: 1px solid color-mix(in srgb, var(--steel) 37%, transparent);
        border-radius: inherit;
        pointer-events: none;
      }

      .watch-dial::after {
        inset: 9.5%;
        border-color: color-mix(in srgb, var(--steel) 25%, transparent);
      }

      .station {
        position: absolute;
        z-index: 2;
        display: grid;
        justify-items: center;
        gap: 4px;
        color: var(--steel);
        font-size: clamp(0.74rem, 1.8vw, 0.9rem);
        line-height: 1;
        text-align: center;
        transition: color 220ms ease, transform 220ms ease;
      }

      .station svg {
        width: clamp(24px, 5.3vw, 31px);
        height: clamp(24px, 5.3vw, 31px);
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.65;
      }

      .station-name { font-weight: 550; letter-spacing: -0.02em; }
      .station[data-station="work"] { top: 13%; left: 50%; transform: translateX(-50%); }
      .station[data-station="study"] { right: 11%; top: 50%; transform: translateY(-50%); }
      .station[data-station="sleep"] { bottom: 13%; left: 50%; transform: translateX(-50%); }
      .station[data-station="gym"] { left: 11%; top: 50%; transform: translateY(-50%); }

      .station.active { color: var(--brass); }

      .hand {
        position: absolute;
        inset: 0;
        z-index: 3;
        transform: rotate(var(--hand-angle));
        transition: transform 680ms cubic-bezier(0.25, 1.18, 0.48, 1);
        pointer-events: none;
      }

      .hand-shaft {
        position: absolute;
        left: 50%;
        top: 21%;
        width: clamp(8px, 1.7vw, 11px);
        height: 29%;
        transform: translateX(-50%);
        clip-path: polygon(40% 0, 60% 0, 77% 100%, 23% 100%);
        background: linear-gradient(90deg, color-mix(in srgb, var(--brass) 75%, #4e3211), var(--brass) 55%, color-mix(in srgb, var(--brass) 86%, #fff));
        filter: drop-shadow(0 3px 2px var(--ring-shadow));
      }

      .hand-tail {
        position: absolute;
        left: 50%;
        top: 50%;
        width: clamp(5px, 1vw, 7px);
        height: 10%;
        transform: translateX(-50%);
        border-radius: 0 0 999px 999px;
        background: var(--brass);
      }

      .pivot {
        position: absolute;
        z-index: 1;
        top: 50%;
        left: 50%;
        width: clamp(19px, 4.6vw, 27px);
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border: 2px solid color-mix(in srgb, var(--ink) 50%, var(--steel));
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--dial-face) 85%, #fff), var(--steel));
        box-shadow: 0 2px 4px var(--ring-shadow);
      }

      .watch-dial[data-freshness="stale"] .hand {
        opacity: 0.68;
        filter: saturate(0.35);
        transform: rotate(calc(var(--hand-angle) + 0.7deg));
      }

      .details { text-align: center; }

      .activity {
        margin: 0;
        font-size: clamp(2.2rem, 7vw, 3.85rem);
        font-weight: 660;
        line-height: 0.94;
        letter-spacing: -0.065em;
      }

      .status-line {
        margin: 9px 0 0;
        font-family: "B612", monospace;
        color: var(--steel);
        font-size: clamp(0.75rem, 2.4vw, 0.9rem);
        line-height: 1.5;
      }

      .freshness { color: var(--fresh); }
      .freshness.stale { color: var(--stale); }

      .poll-copy {
        margin: 7px 0 0;
        color: var(--steel);
        font-size: clamp(0.78rem, 2.2vw, 0.9rem);
      }

      .raw-toggle {
        margin-top: 10px;
        border: 0;
        border-bottom: 1px solid currentColor;
        padding: 0 0 2px;
        color: var(--ink);
        background: transparent;
        cursor: pointer;
        font-size: 0.78rem;
      }

      .raw-data {
        width: min(100%, 350px);
        margin: 3px 0 0;
        padding: 10px 12px;
        overflow: auto;
        border-radius: 8px;
        color: var(--ink);
        background: color-mix(in srgb, var(--steel) 12%, transparent);
        font-family: "B612", monospace;
        font-size: 0.72rem;
        line-height: 1.45;
        text-align: left;
      }

      .raw-data[hidden] { display: none; }

      .source-note {
        margin: 0;
        color: var(--steel);
        font-size: clamp(0.76rem, 2.1vw, 0.88rem);
        text-align: center;
      }

      @media (max-height: 660px) {
        .page { padding-block: 11px; }
        .watch-dial { width: min(57vw, 285px, 42svh); }
        main { gap: 7px; }
        .poll-copy, .raw-toggle { margin-top: 5px; }
      }

      @media (max-width: 420px) {
        .identity span { display: none; }
        .masthead { min-height: 29px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <a class="identity" href="https://github.com/aditya-ramachandran" target="_blank" rel="noreferrer">
          Aditya Ramachandran <span>· GitHub</span>
        </a>
        <button class="theme-toggle" type="button" aria-label="Switch to dark theme">Dark</button>
      </header>

      <main>
        <p class="wordmark">Now</p>
        <section class="watch-dial" aria-label="Current activity dial" data-freshness="fresh">
          <div class="station" data-station="work">
            <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="7" width="24" height="16" rx="2"/><path d="M7 12h18M8 16h2m3 0h2m3 0h2m3 0h2M11 20h10"/></svg>
            <span class="station-name">Work</span>
          </div>
          <div class="station" data-station="study">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 9c-3-2-7-2-11 0v15c4-2 8-2 11 0M16 9c3-2 7-2 11 0v15c-4-2-8-2-11 0M16 9v15"/></svg>
            <span class="station-name">Study</span>
          </div>
          <div class="station" data-station="sleep">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M22 24A10 10 0 0 1 12 8a9 9 0 1 0 10 16Z"/></svg>
            <span class="station-name">Sleep</span>
          </div>
          <div class="station" data-station="gym">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 13v6m4-9v12m4-7h8m4-5v12m4-9v6"/></svg>
            <span class="station-name">Gym</span>
          </div>
          <div class="hand" aria-hidden="true"><span class="hand-shaft"></span><span class="hand-tail"></span></div>
          <span class="pivot" aria-hidden="true"></span>
        </section>

        <section class="details" aria-live="polite">
          <h1 class="activity">Loading</h1>
          <p class="status-line"><span class="updated-copy">Getting current status</span> <span class="freshness">· checking</span></p>
          <p class="poll-copy">Checks every 30 seconds</p>
          <button class="raw-toggle" type="button" aria-expanded="false" aria-controls="raw-data">View raw JSON</button>
          <pre class="raw-data" id="raw-data" hidden></pre>
        </section>
      </main>

      <footer><p class="source-note">Human uptime, reported from my Galaxy Watch.</p></footer>
    </div>

    <script>
      const STATUS_ENDPOINT = "https://personal-status-worker.healthz.workers.dev/status";
      const POLL_INTERVAL_MS = 30_000;
      const STALE_AFTER_MS = 15 * 60 * 1000;
      const angles = { work: 0, study: 90, sleep: 180, gym: -90 };
      const activityNames = { work: "Work", study: "Study", sleep: "Sleep", gym: "Gym" };

      const root = document.documentElement;
      const dial = document.querySelector(".watch-dial");
      const activity = document.querySelector(".activity");
      const updatedCopy = document.querySelector(".updated-copy");
      const freshness = document.querySelector(".freshness");
      const rawData = document.querySelector(".raw-data");
      const rawToggle = document.querySelector(".raw-toggle");
      const themeToggle = document.querySelector(".theme-toggle");
      let latestPayload = null;

      function applyTheme(theme) {
        root.dataset.theme = theme;
        localStorage.setItem("now-theme", theme);
        themeToggle.textContent = theme === "dark" ? "Light" : "Dark";
        themeToggle.setAttribute("aria-label", `Switch to ${theme === "dark" ? "light" : "dark"} theme`);
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#10242b" : "#e8eff2";
      }

      function formatTime(timestamp) {
        return new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit", second: "2-digit" }).format(new Date(timestamp));
      }

      function renderStatus(payload) {
        latestPayload = payload;
        const status = payload.status;
        const timestamp = new Date(payload.timestamp);
        const stale = Date.now() - timestamp.getTime() >= STALE_AFTER_MS;
        const station = document.querySelector(`[data-station="${status}"]`);

        document.querySelectorAll(".station").forEach((item) => item.classList.remove("active"));
        station?.classList.add("active");
        dial.style.setProperty("--hand-angle", `${angles[status]}deg`);
        dial.dataset.freshness = stale ? "stale" : "fresh";
        activity.textContent = activityNames[status];
        updatedCopy.textContent = `Updated ${formatTime(payload.timestamp)}`;
        freshness.textContent = `· ${stale ? "Stale" : "Fresh"}`;
        freshness.classList.toggle("stale", stale);
        rawData.textContent = JSON.stringify(payload, null, 2);
      }

      function showError(message) {
        activity.textContent = "Unavailable";
        updatedCopy.textContent = message;
        freshness.textContent = "· retrying";
        freshness.classList.add("stale");
        rawData.textContent = latestPayload ? JSON.stringify(latestPayload, null, 2) : "{}";
      }

      async function loadStatus() {
        try {
          const response = await fetch(STATUS_ENDPOINT, { cache: "no-store" });
          if (response.status === 404) throw new Error("No status has been set yet");
          if (!response.ok) throw new Error("Status source is unavailable");
          const payload = await response.json();
          if (!Object.hasOwn(activityNames, payload.status) || !payload.timestamp) throw new Error("Status data is invalid");
          renderStatus(payload);
        } catch (error) {
          showError(error.message);
        }
      }

      rawToggle.addEventListener("click", () => {
        const expanded = rawToggle.getAttribute("aria-expanded") === "true";
        rawToggle.setAttribute("aria-expanded", String(!expanded));
        rawToggle.textContent = expanded ? "View raw JSON" : "Hide raw JSON";
        rawData.hidden = expanded;
      });

      themeToggle.addEventListener("click", () => {
        applyTheme(root.dataset.theme === "dark" ? "light" : "dark");
      });

      const savedTheme = localStorage.getItem("now-theme");
      const preferredTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      applyTheme(savedTheme || preferredTheme);
      loadStatus();
      window.setInterval(loadStatus, POLL_INTERVAL_MS);
    </script>
  </body>
</html>
